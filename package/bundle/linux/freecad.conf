<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Weekly AppImage only. Host color-emoji faces make Qt 6.11/FreeType
  print "render glyph failed err=62" (FT_Err_Raster_Overflow).
  Include the host config, then drop color fonts. AppRun keeps
  FONTCONFIG_PATH=/etc/fonts so conda's 48-guessfamily.conf is not loaded.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="color">
          <bool>true</bool>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
