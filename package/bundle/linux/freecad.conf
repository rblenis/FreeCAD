<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Weekly AppImage only.
  FreeType 2.14.3 returns FT_Err_Raster_Overflow (0x62) for every glyph
  in Noto Color Emoji when the glyph is LCD-rendered. Qt 6.11 prints
  "render glyph failed err=62 face=...". The face is a scalable bitmap
  (outline=false, scalable=true, fontformat=TrueType, color=true), so a
  color=true test alone is not a reliable match on every fontconfig.
  If the host fonts.conf include fails, fontconfig throws this file
  away and loads the default config, which brings the emoji face back.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="color">
          <bool>true</bool>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Color Emoji</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Noto Emoji</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Twitter Color Emoji</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>JoyPixels</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>EmojiOne Color</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Segoe UI Emoji</string>
        </patelt>
      </pattern>
      <!-- CBDT/sbix "scalable bitmaps". Real outline fonts stay. -->
      <pattern>
        <patelt name="outline">
          <bool>false</bool>
        </patelt>
        <patelt name="scalable">
          <bool>true</bool>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
